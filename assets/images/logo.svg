<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Glow & Gradients -->
    <radialGradient id="goldRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FFD700" />
      <stop offset="90%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#B8860B" />
    </radialGradient>
    <linearGradient id="redBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="50%" stop-color="#990000" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>
    <linearGradient id="sunburst" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="240" fill="url(#goldRim)" stroke="#990000" stroke-width="6" />
  <circle cx="250" cy="250" r="226" fill="#0F172A" />

  <!-- Sunburst Background Inner -->
  <circle cx="250" cy="230" r="195" fill="url(#redBadge)" />
  
  <!-- Academic Sun Rays Behind Emblem -->
  <path d="M250 80 L250 220 M200 90 L240 220 M300 90 L260 220 M160 120 L230 220 M340 120 L270 220" stroke="#FFD700" stroke-width="3" opacity="0.4" />

  <!-- Graduation Cap Top -->
  <g transform="translate(195, 75) scale(1.1)">
    <polygon points="50,10 95,30 50,50 5,30" fill="#1E293B" stroke="#FFD700" stroke-width="2.5"/>
    <polygon points="25,39 25,65 50,78 75,65 75,39" fill="#0F172A"/>
    <path d="M85,32 L85,68 L88,72 L82,72 L85,68" stroke="#FFD700" stroke-width="3" fill="#FFD700"/>
    <circle cx="50" cy="30" r="4" fill="#FFD700"/>
  </g>

  <!-- Book & Pencil Emblem -->
  <g transform="translate(90, 110)">
    <!-- School House / Book Icon left -->
    <path d="M25,65 L45,35 L65,65 Z" fill="#FF4500" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="35" y="65" width="20" height="35" fill="#333333"/>
    <!-- Pencil -->
    <polygon points="12,40 22,25 32,40 32,95 12,95" fill="#FFCC00" stroke="#000000" stroke-width="1.5"/>
    <polygon points="12,95 22,110 32,95" fill="#FF9999"/>
  </g>

  <!-- Globe / Science Atom right -->
  <g transform="translate(320, 110)">
    <circle cx="45" cy="55" r="30" fill="#22C55E" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="45" cy="55" rx="30" ry="12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="45" cy="55" rx="12" ry="30" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Atom orbits -->
    <ellipse cx="45" cy="15" rx="25" ry="8" fill="none" stroke="#FFD700" stroke-width="2" transform="rotate(30 45 15)"/>
    <ellipse cx="45" cy="15" rx="25" ry="8" fill="none" stroke="#FFD700" stroke-width="2" transform="rotate(-30 45 15)"/>
  </g>

  <!-- Student Silhouettes in Center Ring -->
  <g transform="translate(170, 150)">
    <!-- Open Book Base -->
    <path d="M10,80 Q80,60 150,80 Q220,60 290,80 L280,105 Q210,90 150,105 Q90,90 20,105 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <!-- Left Boy Student Head & Body -->
    <circle cx="105" cy="35" r="22" fill="#0284C7"/>
    <path d="M75,90 C75,55 135,55 135,90 Z" fill="#0284C7"/>
    <!-- Right Girl Student Head & Body -->
    <circle cx="195" cy="35" r="22" fill="#EC4899"/>
    <path d="M165,90 C165,55 225,55 225,90 Z" fill="#EC4899"/>
  </g>

  <!-- Banner Ribbons for Text -->
  <g transform="translate(30, 310)">
    <!-- Dark Red Banner Base -->
    <rect x="20" y="20" width="400" height="90" rx="16" fill="url(#redBadge)" stroke="#FFD700" stroke-width="4"/>
    <rect x="30" y="28" width="380" height="74" rx="10" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Main Title "PRANAMYA" -->
    <text x="220" y="65" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
      PRANAMYA
    </text>

    <!-- Subtitle "TUTORIALS" -->
    <text x="220" y="92" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="22" fill="#FFD700" text-anchor="middle" letter-spacing="6">
      TUTORIALS
    </text>
  </g>

  <!-- Tagline Banner Below -->
  <path d="M100,430 L400,430 L380,465 L120,465 Z" fill="#FFB800" stroke="#990000" stroke-width="2"/>
  <text x="250" y="454" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" fill="#0F172A" text-anchor="middle" letter-spacing="1">
    — Inspiring Young Minds —
  </text>
</svg>
